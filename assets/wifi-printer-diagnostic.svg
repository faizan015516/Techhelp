<svg xmlns="http://www.w3.org/2000/svg" width="480" height="670" viewBox="0 0 480 670" role="img" aria-labelledby="title desc">
<title id="title">Three-stage Wi-Fi printer troubleshooting diagram</title>
<desc id="desc">First check the printer's Wi-Fi connection and note its network address. Second check the Windows computer's network using ipconfig. Third try adding the printer and printing a test page. Network address prefixes and ping results alone do not prove connectivity.</desc>
<rect width="480" height="670" rx="20" fill="#f5f9ff"/>
<text x="28" y="44" fill="#102a4c" font-family="Arial,sans-serif" font-size="25" font-weight="700">Wi-Fi printer diagnosis</text>
<text x="28" y="75" fill="#43536b" font-family="Arial,sans-serif" font-size="16">Work from the printer toward Windows.</text>
<rect x="25" y="102" width="430" height="147" rx="15" fill="#ffffff" stroke="#b8cbe9" stroke-width="2"/>
<rect x="43" y="118" width="146" height="30" rx="15" fill="#dbeafe"/>
<text x="60" y="139" fill="#124294" font-family="Arial,sans-serif" font-size="16" font-weight="700">1 · PRINTER</text>
<text x="43" y="177" fill="#102a4c" font-family="Arial,sans-serif" font-size="20" font-weight="700">Confirm Wi-Fi connection</text>
<text x="43" y="204" fill="#344054" font-family="Arial,sans-serif" font-size="16">If disconnected, use the printer's setup</text>
<text x="43" y="225" fill="#344054" font-family="Arial,sans-serif" font-size="16">menu. Note its IP address if available.</text>
<path d="M240 250 V283" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<path d="M230 273 L240 285 L250 273" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="25" y="290" width="430" height="146" rx="15" fill="#ffffff" stroke="#b8cbe9" stroke-width="2"/>
<rect x="43" y="306" width="192" height="30" rx="15" fill="#dbeafe"/>
<text x="60" y="327" fill="#124294" font-family="Arial,sans-serif" font-size="16" font-weight="700">2 · WINDOWS PC</text>
<text x="43" y="365" fill="#102a4c" font-family="Arial,sans-serif" font-size="20" font-weight="700">Check the active network</text>
<text x="43" y="392" fill="#344054" font-family="Arial,sans-serif" font-size="16">Run ipconfig to see the PC's IPv4</text>
<text x="43" y="413" fill="#344054" font-family="Arial,sans-serif" font-size="16">details and check for guest isolation.</text>
<path d="M240 437 V471" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<path d="M230 461 L240 473 L250 461" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="25" y="478" width="430" height="146" rx="15" fill="#ffffff" stroke="#b8cbe9" stroke-width="2"/>
<rect x="43" y="494" width="114" height="30" rx="15" fill="#dbeafe"/>
<text x="60" y="515" fill="#124294" font-family="Arial,sans-serif" font-size="16" font-weight="700">3 · TEST</text>
<text x="43" y="552" fill="#102a4c" font-family="Arial,sans-serif" font-size="20" font-weight="700">Try Windows printer setup</text>
<text x="43" y="579" fill="#344054" font-family="Arial,sans-serif" font-size="16">Use Printers &amp; scanners → Add device;</text>
<text x="43" y="600" fill="#344054" font-family="Arial,sans-serif" font-size="16">print a test page if it is available.</text>
<text x="28" y="652" fill="#43536b" font-family="Arial,sans-serif" font-size="14">Diagram: general guidance; menus vary by model.</text>
</svg>