name: PrinterResolve 360 printer browser verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Render and interact with real 360 printer models
        run: node tests/live-printer-360.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-printerresolve-360-model-preview
          path: test-artifacts/LIVE-printer-360-*.png
          if-no-files-found: ignore
