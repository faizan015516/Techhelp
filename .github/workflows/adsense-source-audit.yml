name: PrinterResolve independent AdSense source audit
on:
  push:
    branches: [main]
    paths:
      - 'tests/adsense-source-audit.cjs'
      - '.github/workflows/adsense-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit all published HTML, metadata, canonical URLs, source citations, local links and advertising scripts
        run: node tests/adsense-source-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adsense-source-audit-json
          path: test-artifacts/adsense-source-audit.json
          if-no-files-found: error
