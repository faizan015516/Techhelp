name: PrinterResolve desktop and mobile smoke
on:
  push:
    branches:
      - 'redesign/**'
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Run headless desktop and Android-size tests
        run: node tests/browser-smoke.cjs
      - name: Attach visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printerresolve-browser-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
