name: PrinterResolve real mobile contrast on production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Check computed contrast and capture real production screenshot
        run: node tests/live-mobile-contrast.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-printerresolve-android-contrast
          path: test-artifacts/LIVE-windows-cards-mobile.png
          if-no-files-found: ignore
