name: PrinterResolve evidence-led guide browser verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-flagship-guides:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify real live guide observations and next safe test
        run: node tests/live-guide-evidence.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: printerresolve-evidence-guide-previews
          path: test-artifacts/LIVE-evidence-*.png
          if-no-files-found: ignore
