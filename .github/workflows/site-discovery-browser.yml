name: PrinterResolve search and printer selector verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browse-and-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Test search and printer-brand picker on real site
        run: node tests/live-site-discovery.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-printerresolve-site-discovery-screenshots
          path: test-artifacts/LIVE-*-desktop.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-printerresolve-site-discovery-mobile
          path: test-artifacts/LIVE-printer-selector-mobile.png
          if-no-files-found: ignore
