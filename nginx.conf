server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Match Cloudflare Pages' simple legacy redirects.
    location = /refunds { return 301 /terms; }
    location = /refunds/ { return 301 /terms; }
    location = /refunds.html { return 301 /terms; }

    # Resolve canonical extensionless page URLs to their .html files.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Avoid caching HTML while allowing efficient caching of versioned assets.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|webp|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
